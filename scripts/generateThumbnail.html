<!DOCTYPE html>
<html>
<head>
<title>사주500 썸네일 — 실제 앱 화면</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; flex-direction: column; align-items: center; padding: 30px; gap: 20px; font-family: Pretendard, sans-serif; }
  h2 { color: #fff; }
  button { padding: 12px 32px; font-size: 16px; cursor: pointer; border-radius: 8px; border: none; background: #C9A96E; color: #fff; font-weight: bold; }
  .capture-area {
    width: 1932px;
    height: 828px;
    background: linear-gradient(135deg, #0F1825 0%, #1B2A4A 40%, #243656 70%, #1B2A4A 100%);
    display: flex;
    align-items: center;
    padding: 0 80px;
    position: relative;
    overflow: hidden;
    transform: scale(0.5);
    transform-origin: top center;
  }
  /* 배경 빛 */
  .capture-area::before {
    content: '';
    position: absolute;
    top: -200px; right: 200px;
    width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(201,169,110,0.07), transparent 70%);
    pointer-events: none;
  }
  .capture-area::after {
    content: '';
    position: absolute;
    bottom: -100px; left: 300px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(201,169,110,0.04), transparent 70%);
    pointer-events: none;
  }

  .left { flex: 1; padding-right: 60px; position: relative; z-index: 1; }
  .right { display: flex; gap: 24px; position: relative; z-index: 1; }

  .phone {
    width: 340px; height: 700px;
    border-radius: 40px;
    background: #000;
    padding: 8px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
  }
  .phone:first-child { transform: translateY(30px) rotate(-2deg); }
  .phone:last-child { transform: translateY(-20px) rotate(3deg); }
  .phone-screen {
    width: 100%; height: 100%;
    border-radius: 34px;
    overflow: hidden;
    background: #F4F5F8;
  }
  .phone-screen iframe {
    width: 375px; height: 812px;
    border: none;
    transform: scale(0.865);
    transform-origin: 0 0;
  }
  .notch {
    position: absolute;
    top: 10px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 24px;
    background: #000;
    border-radius: 12px;
    z-index: 10;
  }

  .logo { display: flex; align-items: baseline; gap: 8px; margin-bottom: 32px; }
  .logo span:first-child { font-size: 52px; font-weight: 900; color: #fff; }
  .logo span:last-child { font-size: 52px; font-weight: 900; color: #C9A96E; }

  .headline { font-size: 54px; font-weight: 900; color: #fff; line-height: 1.3; margin-bottom: 12px; }
  .headline em { font-style: normal; color: #C9A96E; }

  .sub { font-size: 24px; color: rgba(255,255,255,0.5); line-height: 1.7; margin-bottom: 40px; }

  .stats { display: flex; gap: 48px; margin-bottom: 40px; }
  .stat-num { font-size: 36px; font-weight: 800; color: #C9A96E; }
  .stat-label { font-size: 18px; color: rgba(255,255,255,0.45); margin-top: 2px; }

  .tags { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 36px; }
  .tag {
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 17px; font-weight: 600;
    color: #E8D5A8;
    background: rgba(201,169,110,0.08);
    border: 1px solid rgba(201,169,110,0.2);
  }

  .source {
    font-size: 15px;
    color: rgba(255,255,255,0.2);
  }
</style>
</head>
<body>
<h2>가로형 썸네일 (1932 x 828px) — Win+Shift+S로 캡처</h2>

<div class="capture-area" id="capture">
  <div class="left">
    <div class="logo">
      <span>사주</span><span>500</span>
    </div>
    <div class="headline">
      "이걸 어떻게 알지?"<br/>
      <em>소름 돋는 정확함.</em>
    </div>
    <div class="sub">
      생년월일시만 입력하면 3분 안에<br/>
      나도 몰랐던 내 이야기를 만나게 돼요.
    </div>
    <div class="stats">
      <div>
        <div class="stat-num">500원</div>
        <div class="stat-label">딱 한 번이면 끝</div>
      </div>
      <div>
        <div class="stat-num">12가지</div>
        <div class="stat-label">심층 분석</div>
      </div>
      <div>
        <div class="stat-num">매일</div>
        <div class="stat-label">무료 운세</div>
      </div>
    </div>
    <div class="tags">
      <div class="tag">사주 풀이</div>
      <div class="tag">사주 상담</div>
      <div class="tag">꿈해몽</div>
      <div class="tag">궁합</div>
      <div class="tag">대운 해설</div>
    </div>
    <div class="source">적천수 · 자평진전 · 궁통보감 — 600년 명리학 원전 기반</div>
  </div>

  <div class="right">
    <!-- 폰 1: 홈 화면 -->
    <div class="phone">
      <div class="notch"></div>
      <div class="phone-screen">
        <iframe src="https://appintoss-saju.web.app/"></iframe>
      </div>
    </div>
    <!-- 폰 2: 결과 화면 -->
    <div class="phone">
      <div class="notch"></div>
      <div class="phone-screen">
        <iframe src="https://appintoss-saju.web.app/result/local"></iframe>
      </div>
    </div>
  </div>
</div>

<p style="color:#888; font-size:14px;">💡 Win+Shift+S로 위 영역을 캡처하세요 (1932x828 영역)</p>
<p style="color:#666; font-size:12px;">폰 화면이 로드되는 데 2~3초 걸릴 수 있어요</p>
</body>
</html>
